name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build & publish release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Package archive
        run: |
          zip -r MANINY-${{ github.ref_name }}.zip . \
            --exclude ".git/*" \
            --exclude "node_modules/*"

      - uses: softprops/action-gh-release@v2
        with:
          files: MANINY-${{ github.ref_name }}.zip
          generate_release_notes: true
