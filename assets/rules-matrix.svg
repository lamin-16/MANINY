<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="auto">
  <defs>
    <linearGradient id="matrixBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06080D"/>
      <stop offset="50%" stop-color="#0D1322"/>
      <stop offset="100%" stop-color="#140C18"/>
    </linearGradient>
    <linearGradient id="headerGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD000"/>
      <stop offset="50%" stop-color="#00F5D4"/>
      <stop offset="100%" stop-color="#FF5A1F"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="360" rx="22" fill="url(#matrixBg)"/>
  <rect x="12" y="12" width="1176" height="336" rx="16" fill="none" stroke="url(#headerGold)" stroke-width="2.5"/>

  <text x="42" y="54" fill="url(#headerGold)" font-family="monospace, sans-serif" font-size="24" font-weight="800">MANINY RULE &amp; STATE MATRIX</text>
  <text x="42" y="80" fill="#94A3B8" font-family="monospace, sans-serif" font-size="14">DETECTION RULES  •  AUTO-PATCH ELIGIBILITY  •  DEFENDER REVIEW &amp; ROLLBACK STATES</text>

  <!-- Column 1: Code & Secret Rules -->
  <g transform="translate(42, 106)" font-family="monospace, sans-serif">
    <rect x="0" y="0" width="350" height="214" rx="12" fill="#0B101B" stroke="#FF5A1F" stroke-width="1.8"/>
    <text x="18" y="30" fill="#FF8C42" font-size="16" font-weight="800">CODE &amp; SECRET RULES</text>
    <text x="18" y="64" fill="#F8FAFC" font-size="14">• CODE-001: eval() [HIGH | FIX]</text>
    <text x="18" y="94" fill="#F8FAFC" font-size="14">• CODE-002: new Function() [FIX]</text>
    <text x="18" y="124" fill="#FBBF24" font-size="14">• CODE-003: exec/execSync [REVIEW]</text>
    <text x="18" y="154" fill="#F87171" font-size="14">• SEC-001: Hardcoded Secret [CRIT]</text>
    <text x="18" y="190" fill="#A78BFA" font-size="13">Workspace Sandboxed + Policy Guard</text>
  </g>

  <!-- Column 2: HTTP Hardening -->
  <g transform="translate(425, 106)" font-family="monospace, sans-serif">
    <rect x="0" y="0" width="350" height="214" rx="12" fill="#0B101B" stroke="#00F5D4" stroke-width="1.8"/>
    <text x="18" y="30" fill="#00F5D4" font-size="16" font-weight="800">HTTP &amp; PROBE CHECKS</text>
    <text x="18" y="64" fill="#F8FAFC" font-size="14">• HTTP-001: rejectUnauthorized:false</text>
    <text x="18" y="94" fill="#F8FAFC" font-size="14">• HTTP-002: http:// -&gt; https://</text>
    <text x="18" y="124" fill="#38BDF8" font-size="14">• EXP-HSTS: Transport Header Check</text>
    <text x="18" y="154" fill="#38BDF8" font-size="14">• ADV-SIM: Safe Reflection Probe</text>
    <text x="18" y="190" fill="#00F5D4" font-size="13">Requires --allow-host &amp; --allow-probes</text>
  </g>

  <!-- Column 3: Lifecycle & Rollback -->
  <g transform="translate(808, 106)" font-family="monospace, sans-serif">
    <rect x="0" y="0" width="350" height="214" rx="12" fill="#0B101B" stroke="#4ADE80" stroke-width="1.8"/>
    <text x="18" y="30" fill="#4ADE80" font-size="16" font-weight="800">STATES &amp; AUTO-ROLLBACK</text>
    <text x="18" y="64" fill="#FFD000" font-size="14">1. detected -&gt; verified_exploitable</text>
    <text x="18" y="94" fill="#D8B4FE" font-size="14">2. patched (backup + unifiedDiff)</text>
    <text x="18" y="124" fill="#4ADE80" font-size="14">3. verified_fixed (review passed)</text>
    <text x="18" y="154" fill="#FB7185" font-size="14">4. rolled_back (backup restored)</text>
    <text x="18" y="190" fill="#94A3B8" font-size="13">Exports JSON &amp; SARIF 2.1.0 Reports</text>
  </g>
</svg>
