<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="auto">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070B"/>
      <stop offset="55%" stop-color="#0C111D"/>
      <stop offset="100%" stop-color="#171009"/>
    </linearGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFF3A1"/>
      <stop offset="50%" stop-color="#FFD000"/>
      <stop offset="100%" stop-color="#FF7A00"/>
    </linearGradient>
    <linearGradient id="dragonAura" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF2E00"/>
      <stop offset="50%" stop-color="#FF9E00"/>
      <stop offset="100%" stop-color="#FFF3B0"/>
    </linearGradient>
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5D4"/>
      <stop offset="100%" stop-color="#00BBF9"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" rx="24" fill="url(#bgGrad)"/>
  <rect x="14" y="14" width="1172" height="392" rx="18" fill="none" stroke="url(#goldText)" stroke-width="3"/>
  <rect x="24" y="24" width="1152" height="372" rx="14" fill="none" stroke="#00F5D4" stroke-opacity="0.25" stroke-width="1.5"/>

  <!-- Dragon Emblem -->
  <g transform="translate(65, 45)">
    <circle cx="155" cy="165" r="142" fill="none" stroke="url(#dragonAura)" stroke-width="2" stroke-dasharray="14 8"/>
    <circle cx="155" cy="165" r="126" fill="none" stroke="#00F5D4" stroke-width="1.2" opacity="0.45"/>

    <!-- Flame Wings -->
    <path d="M155 12 L125 52 L88 26 L102 72 L46 52 L78 102 L16 106 L72 144 L14 182 L82 196 L48 248 L112 232 L106 288 L155 252 L204 288 L198 232 L262 248 L228 196 L296 182 L238 144 L294 106 L232 102 L264 52 L208 72 L222 26 L185 52 Z" fill="url(#dragonAura)" opacity="0.92"/>

    <!-- Armored Dragon Head -->
    <path d="M155 46 L124 84 L90 74 L108 114 L68 132 L92 164 L80 206 L118 228 L136 264 L155 238 L174 264 L192 228 L230 206 L218 164 L242 132 L202 114 L220 74 L186 84 Z" fill="#090C14" stroke="url(#goldText)" stroke-width="4.5" stroke-linejoin="round"/>

    <!-- Crown & Armor Nodes -->
    <polygon points="155,58 174,94 155,114 136,94" fill="url(#goldText)"/>
    <polygon points="155,174 178,198 155,224 132,198" fill="#121826" stroke="#00F5D4" stroke-width="2"/>

    <!-- Glowing Eyes -->
    <polygon points="104,142 136,136 126,154" fill="#FFF8C9"/>
    <polygon points="206,142 174,136 184,154" fill="#FFF8C9"/>
    <circle cx="121" cy="144" r="4" fill="#FF2E00"/>
    <circle cx="189" cy="144" r="4" fill="#FF2E00"/>
  </g>

  <!-- Title & Multi-Color Telemetry -->
  <text x="415" y="122" fill="url(#goldText)" font-family="monospace, sans-serif" font-size="82" font-weight="900" letter-spacing="10">MANINY</text>
  <text x="418" y="168" fill="#00F5D4" font-family="sans-serif" font-size="24" font-weight="700">MULTI-STAGE VERIFICATION, PATCHING &amp; AUTO-ROLLBACK ENGINE</text>

  <!-- Color-Coded Pipeline Badges inside SVG -->
  <g transform="translate(418, 198)" font-family="monospace, sans-serif" font-size="16" font-weight="800">
    <rect x="0" y="0" width="136" height="38" rx="8" fill="#19130A" stroke="#FFD000" stroke-width="2"/>
    <text x="68" y="24" fill="#FFD000" text-anchor="middle">1. DETECT</text>

    <rect x="148" y="0" width="136" height="38" rx="8" fill="#091D24" stroke="#00F5D4" stroke-width="2"/>
    <text x="216" y="24" fill="#00F5D4" text-anchor="middle">2. VERIFY</text>

    <rect x="296" y="0" width="150" height="38" rx="8" fill="#240D0A" stroke="#FF5A1F" stroke-width="2"/>
    <text x="371" y="24" fill="#FF8C42" text-anchor="middle">3. SIMULATE</text>

    <rect x="458" y="0" width="112" height="38" rx="8" fill="#141126" stroke="#A855F7" stroke-width="2"/>
    <text x="514" y="24" fill="#D8B4FE" text-anchor="middle">4. FIX</text>

    <rect x="582" y="0" width="165" height="38" rx="8" fill="#0A2118" stroke="#22C55E" stroke-width="2"/>
    <text x="664" y="24" fill="#4ADE80" text-anchor="middle">5. ROLLBACK</text>
  </g>

  <line x1="418" y1="264" x2="1150" y2="264" stroke="url(#cyanAccent)" stroke-width="2"/>

  <text x="418" y="302" fill="#F8FAFC" font-family="monospace, sans-serif" font-size="19" font-weight="700">TYPESCRIPT STRICT  •  JSON &amp; SARIF 2.1.0  •  SCOPE GUARD</text>
  <text x="418" y="338" fill="#FFB703" font-family="monospace, sans-serif" font-size="17">SANDBOXED WORKSPACE  •  BACKUP SNAPSHOTS  •  DEFENSIVE REVIEW</text>
</svg>
