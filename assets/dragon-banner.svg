<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 380" width="100%" height="380">
  <defs>
    <radialGradient id="coreGlow" cx="22%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#FF6A1A" stop-opacity="0.34"/>
      <stop offset="45%" stop-color="#D4AF37" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#06080B" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="goldArmor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5B8"/>
      <stop offset="35%" stop-color="#E5B93C"/>
      <stop offset="75%" stop-color="#B0811B"/>
      <stop offset="100%" stop-color="#6E4B07"/>
    </linearGradient>

    <linearGradient id="infernoFlame" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B81D13"/>
      <stop offset="40%" stop-color="#FF5A1F"/>
      <stop offset="78%" stop-color="#FFB703"/>
      <stop offset="100%" stop-color="#FFF8CC"/>
    </linearGradient>

    <linearGradient id="cyberBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5A1F" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#FFD700" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FFD700" stop-opacity="0.08"/>
    </linearGradient>

    <pattern id="digitalGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#D4AF37" stroke-opacity="0.07" stroke-width="1"/>
      <circle cx="0" cy="0" r="1.2" fill="#FFD700" fill-opacity="0.16"/>
    </pattern>
  </defs>

  <!-- Base & Digital Grid -->
  <rect width="1400" height="380" rx="22" fill="#06080B"/>
  <rect width="1400" height="380" rx="22" fill="url(#digitalGrid)"/>
  <rect width="1400" height="380" rx="22" fill="url(#coreGlow)"/>

  <!-- Outer & Inner Golden Frames -->
  <rect x="12" y="12" width="1376" height="356" rx="17" fill="none" stroke="url(#goldArmor)" stroke-width="2.5"/>
  <rect x="20" y="20" width="1360" height="340" rx="13" fill="none" stroke="#FFD700" stroke-opacity="0.22" stroke-width="1"/>

  <!-- Corner Brackets -->
  <path d="M 34 62 L 34 34 L 62 34" fill="none" stroke="#FFD700" stroke-width="3"/>
  <path d="M 1338 34 L 1366 34 L 1366 62" fill="none" stroke="#FFD700" stroke-width="3"/>
  <path d="M 34 318 L 34 346 L 62 346" fill="none" stroke="#FFD700" stroke-width="3"/>
  <path d="M 1338 346 L 1366 346 L 1366 318" fill="none" stroke="#FFD700" stroke-width="3"/>

  <!-- Digital Dragon Emblem (Left) -->
  <g transform="translate(75, 36)">
    <!-- Outer Halo Ring -->
    <circle cx="152" cy="154" r="134" fill="none" stroke="url(#goldArmor)" stroke-width="1.5" stroke-dasharray="10 6" opacity="0.65"/>
    <circle cx="152" cy="154" r="122" fill="none" stroke="#FF5A1F" stroke-width="1" opacity="0.35"/>

    <!-- Flame Wings & Fire Crest -->
    <path d="M 152 14
             L 124 46 L 92 22 L 104 64 L 54 44 L 82 88 L 24 88 L 72 124 L 18 156 L 78 172
             L 44 218 L 102 208 L 96 258 L 136 226 L 152 276 L 168 226 L 208 258 L 202 208
             L 260 218 L 226 172 L 286 156 L 232 124 L 280 88 L 222 88 L 250 44 L 200 64
             L 212 22 L 180 46 Z"
          fill="url(#infernoFlame)" opacity="0.88"/>

    <!-- Armored Dragon Head & Horns -->
    <path d="M 152 44
             L 126 78 L 96 68 L 112 104 L 74 118 L 96 146 L 84 184 L 116 204
             L 132 238 L 152 216 L 172 238 L 188 204 L 220 184 L 208 146
             L 230 118 L 192 104 L 208 68 L 178 78 Z"
          fill="#0B0E14" stroke="url(#goldArmor)" stroke-width="4" stroke-linejoin="round"/>

    <!-- Crown Spine & Scales -->
    <polygon points="152,54 166,86 152,102 138,86" fill="url(#goldArmor)"/>
    <polygon points="152,162 172,182 152,204 132,182" fill="#131822" stroke="url(#goldArmor)" stroke-width="2"/>

    <!-- Glowing Dragon Eyes -->
    <polygon points="108,132 134,126 126,142" fill="#FFF3B0"/>
    <polygon points="196,132 170,126 178,142" fill="#FFF3B0"/>
    <circle cx="122" cy="133" r="3" fill="#FF3B00"/>
    <circle cx="182" cy="133" r="3" fill="#FF3B00"/>

    <!-- Digital Node Accents -->
    <line x1="286" y1="154" x2="345" y2="154" stroke="url(#cyberBeam)" stroke-width="2"/>
    <circle cx="345" cy="154" r="4" fill="#FFD700"/>
  </g>

  <!-- Typography & Pipeline Telemetry (Right) -->
  <text x="435" y="114" fill="url(#goldArmor)" font-family="monospace, sans-serif" font-size="76" font-weight="900" letter-spacing="12">MANINY</text>

  <text x="438" y="156" fill="#F8FAFC" font-family="sans-serif" font-size="22" font-weight="600">
    Autonomous Multi-Stage Security Verification, Remediation &amp; Rollback Engine
  </text>


