<svg width="100%" viewBox="0 0 1200 420" role="img" xmlns="http://www.w3.org/2000/svg">
<title>MANINY DIGITAL — Elite Offensive Security CLI</title>
<desc>Geometric low-poly wolf head in dark navy with amber eyes, MANINY DIGITAL branding</desc>
<style>
  rect.bg { fill: #060c1e; }
  .f0  { fill: #0b1428; }
  .f1  { fill: #111e38; }
  .f2  { fill: #172540; }
  .f3  { fill: #1d2e50; }
  .f4  { fill: #243660; }
  .f5  { fill: #2b4070; }
  .f6  { fill: #324878; }
  .f7  { fill: #1a0a30; }
  .f8  { fill: #22103c; }
  .eye   { fill: #e8920a; }
  .pupil { fill: #060e22; }
  .muzzle{ fill: #2a4278; }
  .lbl { font-family: 'Courier New', monospace; letter-spacing: 10px; fill: #c8dcff; font-weight: 700; }
  .sub { font-family: 'Courier New', monospace; letter-spacing: 7px;  fill: #3a5a90; font-weight: 400; }
  .tag { font-family: 'Courier New', monospace; letter-spacing: 2px;  fill: #2a4070; font-weight: 400; }
  .div { stroke: #1e3a6a; stroke-width: 0.8; }
</style>
<!-- background -->
<rect class="bg" width="1200" height="420"/>
<!-- grid dots -->
<circle cx="60"   cy="60"   r="1.5" fill="#2a4a80" opacity="0.4"/>
<circle cx="120"  cy="35"   r="1.5" fill="#2a4a80" opacity="0.3"/>
<circle cx="40"   cy="120"  r="1.5" fill="#2a4a80" opacity="0.3"/>
<circle cx="1140" cy="60"   r="1.5" fill="#2a4a80" opacity="0.4"/>
<circle cx="1160" cy="100"  r="1.5" fill="#2a4a80" opacity="0.3"/>
<circle cx="1080" cy="38"   r="1.5" fill="#2a4a80" opacity="0.3"/>
<circle cx="60"   cy="360"  r="1.5" fill="#2a4a80" opacity="0.3"/>
<circle cx="40"   cy="330"  r="1.5" fill="#2a4a80" opacity="0.3"/>
<circle cx="1140" cy="350"  r="1.5" fill="#2a4a80" opacity="0.3"/>
<circle cx="1160" cy="380"  r="1.5" fill="#2a4a80" opacity="0.3"/>
<!-- === WOLF HEAD (centered at x=600) === -->
<g transform="translate(600,210) scale(1.5)">
  <!-- ears -->
  <polygon class="f1"  points="-92,0  -72,-52  -42,-4"/>
  <polygon class="f1"  points=" 92,0   72,-52   42,-4"/>
  <polygon class="f7"  points="-83,-3 -72,-42  -48,-6"/>
  <polygon class="f7"  points=" 83,-3  72,-42   48,-6"/>
  <!-- forehead -->
  <polygon class="f2"  points="-92,0  -42,-4  -52,38  -78,42"/>
  <polygon class="f2"  points=" 92,0   42,-4   52,38   78,42"/>
  <polygon class="f3"  points="-42,-4  42,-4   38,18   0,26  -38,18"/>
  <polygon class="f4"  points="-38,18   0,26   38,18   34,42   0,48  -34,42"/>
  <!-- brow -->
  <polygon class="f1"  points="-78,42  -52,38  -58,60  -78,65"/>
  <polygon class="f1"  points=" 78,42   52,38   58,60   78,65"/>
  <!-- nose bridge -->
  <polygon class="f4"  points="-34,42   0,48   34,42  30,68   0,74  -30,68"/>
