  <polygon class="f0"  points="-12,82  12,82   8,92  -8,92"/>
  <!-- lower muzzle -->
  <polygon class="f2"  points="-68,96  -48,88  -42,113  -58,120"/>
  <polygon class="f2"  points=" 68,96   48,88   42,113   58,120"/>
  <polygon class="f5"  points="-28,95   0,102   28,95   22,118   0,125  -22,118"/>
  <!-- jaw -->
  <polygon class="f1"  points="-100,90  -78,65  -68,96  -84,125  -100,130"/>
  <polygon class="f1"  points=" 100,90   78,65   68,96   84,125   100,130"/>
  <!-- chin -->
  <polygon class="f2"  points="-84,125  -58,120  -40,138  -58,145"/>
  <polygon class="f2"  points=" 84,125   58,120   40,138   58,145"/>
  <polygon class="f3"  points="-40,138  -22,118   0,125   22,118   40,138   30,150   0,155  -30,150"/>
  <!-- throat -->
  <polygon class="f1"  points="-100,130 -84,125 -58,145 -30,150   0,155  30,150  58,145  84,125  100,130  100,170 -100,170"/>
</g>
<!-- === TEXT RIGHT SIDE === -->
<line x1="880" y1="80" x2="880" y2="340" class="div"/>
<!-- badge row -->
<rect x="900" y="80"  width="88"  height="20" rx="4" fill="#0d1e3a"/>
<rect x="900" y="80"  width="38"  height="20" rx="4" fill="#182e50"/>
<text x="919" y="94" font-family="monospace" font-size="10" fill="#7098cc">node</text>
<text x="952" y="94" font-family="monospace" font-size="10" fill="#c8dcff">≥20</text>
<rect x="998" y="80"  width="96"  height="20" rx="4" fill="#0d1e3a"/>
<rect x="998" y="80"  width="44"  height="20" rx="4" fill="#182e50"/>
<text x="1012" y="94" font-family="monospace" font-size="10" fill="#7098cc">lang</text>
<text x="1055" y="94" font-family="monospace" font-size="10" fill="#c8dcff">TypeScript</text>
<rect x="1104" y="80" width="72"  height="20" rx="4" fill="#0d1e3a"/>
<rect x="1104" y="80" width="44"  height="20" rx="4" fill="#182e50"/>
<text x="1119" y="94" font-family="monospace" font-size="10" fill="#7098cc">deps</text>
<text x="1152" y="94" font-family="monospace" font-size="10" fill="#38c880">0</text>
<!-- main title -->
<text x="900" y="160" class="lbl" font-size="52">MANINY</text>
<text x="900" y="210" class="sub" font-size="16">D I G I T A L</text>
<!-- divider -->
<line x1="900" y1="225" x2="1180" y2="225" class="div"/>
<!-- taglines -->
<text x="900" y="250" font-family="monospace" font-size="12" fill="#4a6a9a">🐺  Elite Offensive Security</text>
<text x="900" y="272" font-family="monospace" font-size="12" fill="#4a6a9a">⛓   Hybrid Chain Correlator</text>
<text x="900" y="294" font-family="monospace" font-size="12" fill="#4a6a9a">📡  Live Exploit Verification</text>
<text x="900" y="316" font-family="monospace" font-size="12" fill="#4a6a9a">🔬  Multi-Agent JSON Output</text>
<!-- divider -->
<line x1="900" y1="330" x2="1180" y2="330" class="div"/>
<text x="900" y="350" class="tag" font-size="11">TypeScript · Node.js · Zero Runtime Deps · Termux-ready</text>
<!-- bottom bar -->
<rect x="0" y="398" width="1200" height="22" fill="#040810"/>
<line x1="0" y1="398" x2="1200" y2="398" class="div"/>
<text x="600" y="413" text-anchor="middle" font-family="monospace" font-size="9" fill="#1e3060">lamin-16/MANINY  ·  MIT License  ·  v0.2.0</text>
